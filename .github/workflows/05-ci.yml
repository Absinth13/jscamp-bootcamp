name: 05- CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs: 
  frontend-lint: 
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Preparar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          run_install: false
      
      - name: Install dependecies
       
        run: | 
          cd 12-ejercicio-cicd/projects/frontend
          echo "::group::Instalar dependecias"
          pnpm install --frozen-lockfile
         
      - name: Lint
        run: | 
          cd 12-ejercicio-cicd/projects/frontend
          echo "::group::Lint"
          pnpm lint:frontend
          echo "::endgroup::"
          
          
  frontend-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Preparar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          run_install: false
      
      - name: Install dependecies
       
        run: | 
          cd 12-ejercicio-cicd/projects/frontend
          echo "::group::Instalar dependecias"
          pnpm install --frozen-lockfile
         
      - name: Test
        run: | 
          cd 12-ejercicio-cicd/projects/frontend
          echo "::group::Test"
          pnpm test:frontend
          echo "::endgroup::"

     
  backend-lint: 
     runs-on: ubuntu-24.04
     steps:
       - name: Checkout code
         uses: actions/checkout@v6
      
       - name: Preparar pnpm
         uses: pnpm/action-setup@v6
         with:
           version: 11
           run_install: false
      
       - name: Instalar dependencias
         run: | 
           cd 12-ejercicio-cicd/projects/backend
           echo "::group::Instalar dependencias"
           pnpm install --frozen-lockfile
        
       - name: Lint
         run: |
            cd 12-ejercicio-cicd/projects/backend
            echo "::group::Lint"  
            pnpm run lint  
            echo "::endgroup::" 
            
  backend-test:
     runs-on: ubuntu-24.04
     steps:
       - name: Checkout code
         uses: actions/checkout@v6
      
       - name: Preparar pnpm
         uses: pnpm/action-setup@v6
         with:
           version: 11
           run_install: false
      
       - name: Instalar dependencias
         run: | 
           cd 12-ejercicio-cicd/projects/backend
           echo "::group::Instalar dependencias"
           pnpm install --frozen-lockfile
        
       - name: Test
         run: |
            cd 12-ejercicio-cicd/projects/backend
            echo "::group::Test"  
            pnpm run test  
            echo "::endgroup::" 
